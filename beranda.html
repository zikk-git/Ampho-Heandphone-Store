<!DOCTYPE html>
<html lang = "id">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>AMPHO GADGET STORE</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <script src="jsweb.js" defer></script>
    </head>
    
    <body>
        <header class="header">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS_LYCmvoCeQ4g2k_4d3fCMcDsklcajqktnI_3msZJjsg&s=10" alt="header foto">
            <div class="header-text">
                <h4>AMPHO HANDPHONE STORE</h4>
                <p>Jual Handphone Murah dan Original</p>
            </div>
    
        </header>

        <nav>
            <ul>
                <div class="search-bar">
                    <input type="text" placeholder="Cari produk...">
                    <button>
                        <i class="bi bi-search"></i>
                    </button>
                </div>
                <a href="beranda.html">
                    <i class="bi bi-house-fill"></i> Beranda
                </a>
                <a href="#">
                    <i class="bi bi-grid-fill"></i> Produk
                </a>
                <li>
                    <a href="#" onclick="tampilkanKeranjang()">
                        <i class="bi bi-cart-fill"></i> 
                        Keranjang (<span id="jumlah-keranjang">0</span>)
                    </a>
                </li>
            </ul>
      </nav>

      <div class="container">
        <div class="card-produk">
            <a href="redmagic.html" class="produk-deskripsi">

                <h4>Nubia Redmagic 11 Pro</h4>
                <p>Rp 22.380.000</p>
            </a>
            <h2>
                <button class="keranjang" onclick="tambahKeranjang('Nubia Redmagic 11 Pro', 22380000)">
                    <i class="bi bi-cart-fill"></i>
                    Keranjang
                </button>
            </h2>
        </div>

        <div class="card-produk">
            <a href="iphone.html" class="produk-deskripsi">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQJH5dNrCIagJali-7QOZL7Cqay5Tfk-r-adz_CgUtlqA&s=10" alt="iphone 17 pro max">
                <h4>Iphone 11 Pro Max</h4>
                <p>Rp 24.999.000</p>
            </a>
            <h2>
                <button class="keranjang" onclick="tambahKeranjang('Iphone 11 Pro Max', 24999000)">
                    <i class="bi bi-cart-fill"></i>
                    Keranjang
                </button>
            </h2>
        </div>

        <div class="card-produk">
            <a href="samsung.html" class="produk-deskripsi">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTmpvZHMHZ8yPGQKiNS0JYCRhI7ssRGxk2QpL3BoDFKpg&s=10" alt="samsung galaxy s26 ultra">
                <h4>Samsung Galaxy S26 Ultra</h4>
                <p>Rp 25.499.000</p>
            </a>
            <h2>
                <button class="keranjang" onclick="tambahKeranjang('Samsung Galaxy S26 Ultra', 25499000)">
                    <i class="bi bi-cart-fill"></i>
                    Keranjang
                </button>
            </h2>
        </div>
        
        <div class="card-produk">
            <a href="xiaomi.html" class="produk-deskripsi">
                <img src="https://i02.appmifile.com/mi-com-product/fly-birds/xiaomi-17-ultra/m/23mm-img-leica.png" alt="xiaomi 17 ultra">
                <h4>Xiaomi 17 Ultra</h4>
                <p>Rp 19.999.000</p>
            </a>
            <h2>
                <button class="keranjang" onclick="tambahKeranjang('Xiaomi 17 Ultra', 19999000)">

                    Keranjang
                </button>
            </h2>

                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSAM-UibWsHph1-zhqfKWpTYl60KHtU0zFT_Qk6WXWPGQ&s=10" alt="oppo find x9 ultra">
                <h4>Oppo Find X9 Ultra</h4>
                <p>Rp 27.999.000</p>
            </a>
            <h2>
                <button class="keranjang" onclick="tambahKeranjang('Oppo Find X9 Ultra', 27999000)">
