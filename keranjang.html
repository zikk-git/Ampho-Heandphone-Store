<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="utf-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>AMPHO GADGET STORE</title>

    <link rel="stylesheet"
        href="style.css">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <script src="jsweb.js" defer></script>

</head>


<body>


    <!-- Navigasi -->
    <nav>

        <ul>


            <!-- Tombol Kembali -->
            <a href="#"
                onclick="history.back(); return false;"
                class="tombol-kembali">

                <i class="bi bi-arrow-left"></i>

            </a>


            <!-- Search -->
            <div class="search-bar">

                <input
                    type="text"
                    placeholder="Cari produk...">

                <button>

                    <i class="bi bi-search"></i>

                </button>

            </div>


            <!-- Beranda -->
            <a href="beranda.html">

                <i class="bi bi-house-fill"></i>

                Beranda

            </a>


            <!-- Produk -->
            <a href="#">

                <i class="bi bi-grid-fill"></i>

                Produk

            </a>


            <!-- Keranjang -->
            <li>

                <a href="keranjang.html">

                    <i class="bi bi-cart-fill"></i>

                    Keranjang
                    (<span id="jumlah-keranjang">0</span>)

                </a>

            </li>


        </ul>

    </nav>



    <!-- Keranjang Belanja -->
    <div class="container-keranjang">


        <h1>

            <i class="bi bi-cart-fill"></i>

            Keranjang Belanja

        </h1>


        <!-- Isi Keranjang -->
        <div id="isi-keranjang">

        </div>



        <!-- Total -->
        <div class="total-keranjang">


            <h2>

                Total:

                <span id="total-harga">
                    Rp 0
                </span>

            </h2>


            <!-- Checkout -->
            <button
                class="checkout"
                onclick="checkout()">

                <i class="bi bi-bag-check-fill"></i>

                Checkout

            </button>


        </div>


    </div>


</body>

<footer class="footer">

    <div class="footer-kontak">
        <h3>Kontak</h3>
        <p><i class="bi bi-telephone-fill"></i> 082252211270</p>
        <p><i class="bi bi-envelope-fill"></i> alzikri986@gmail.com</p>
        <p><i class="bi bi-geo-alt-fill"></i> Banjarmasin, Kalimantan Selatan</p>
    </div>

    <div class="footer-hakcipta">
        <p>&copy; 2026 AMPHO HANDPHONE STORE. Semua Hak Dilindungi.</p>
    </div>
</footer>

</html>
