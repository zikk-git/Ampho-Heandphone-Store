<!DOCTYPE html>
<html lang="id">

    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>AMPHO GADGET STORE</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
        <script src="jsweb.js" defer></script>
    </head>

    <body>
        <nav>
            <ul>
                <div class="search-bar">
                    <input type="text" placeholder="Cari produk...">
                    <button>
                        <i class="bi bi-search"></i>
                    </button>
                </div>
                <a href="beranda.html">
                    <i class="bi bi-house-fill"></i> Beranda
                </a>
                <a href="#">
                    <i class="bi bi-grid-fill"></i> Produk
                </a>
                <li>
                    <a href="keranjang.html">
                        <i class="bi bi-cart-fill"></i> 
                        Keranjang (<span id="jumlah-keranjang">0</span>)
                    </a>
                </li>
            </ul>
        </nav>

        <div class="container-keranjang">
            <h1>
                <i class="bi bi-cart-fill"></i>
                Keranjang Belanja
            </h1>

            <div id="isi-keranjang">

            </div>

            <div class="total-keranjang">

                <h2>
                    Total:
                    <span id="total-harga">Rp 0</span>
                </h2>

                <button class="checkout" onclick="checkout()">
                    <i class="bi bi-bag-check-fill"></i>
                    Checkout
                </button>

            </div>
        </div>
    </body>
</html>
